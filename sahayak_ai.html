<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0b0f19" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="Sahayak AI — Intent-Aware Personal Accessibility Copilot" />
<title>Sahayak AI (सहायक AI) — Accessibility Copilot</title>
<style>
  /* ─── Reset & Base ────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    background: #050811; -webkit-tap-highlight-color: transparent; user-select: none; color: #f8fafc; }
  button { cursor: pointer; border: none; background: none; font-family: inherit; color: inherit; }
  input, textarea { font-family: inherit; }
  ::-webkit-scrollbar { display: none; }

  /* ─── Phone Frame (Obsidian Pro Device) ───────────────────── */
  #root { display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 16px;
    background: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(37, 99, 235, 0.15) 0px, transparent 50%), #050811; }
  
  .phone-frame { position: relative; width: 100%; max-width: 414px;
    height: min(890px, 97vh); background: #0c101d; border-radius: 54px;
    padding: 10px; box-shadow: 0 40px 100px -20px rgba(0,0,0,0.95),
      0 0 0 10px #171f33, inset 0 0 0 2px rgba(255,255,255,0.12); }
  
  .phone-screen { width: 100%; height: 100%; border-radius: 46px; overflow: hidden;
    display: flex; flex-direction: column; background: #0b0f19;
    transition: background 0.3s ease, color 0.3s ease; position: relative; }

  /* Ambient Mesh Background inside screen */
  .screen-bg { position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(circle at 50% -10%, rgba(59, 130, 246, 0.18) 0%, transparent 60%),
                radial-gradient(circle at 100% 60%, rgba(99, 102, 241, 0.12) 0%, transparent 50%); }

  /* ─── Dynamic Island Notch ────────────────────────────────── */
  .phone-pill { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 124px; height: 30px; background: #000; border-radius: 20px; z-index: 40;
    display: flex; align-items: center; justify-content: space-between; padding: 0 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.08); }
  .phone-pill-cam { width: 11px; height: 11px; border-radius: 50%; background: #0d1322;
    box-shadow: inset 0 0 0 2px #1e293b; }
  .phone-pill-wave { display: flex; items-center; gap: 2px; }
  .phone-pill-bar { width: 3px; height: 10px; background: #3b82f6; border-radius: 2px; animation: wave 1.2s infinite ease-in-out; }
  .phone-pill-bar:nth-child(2) { animation-delay: 0.2s; height: 14px; background: #60a5fa; }
  .phone-pill-bar:nth-child(3) { animation-delay: 0.4s; height: 8px; background: #818cf8; }
  @keyframes wave { 0%,100%{transform:scaleY(0.5)} 50%{transform:scaleY(1.2)} }

  /* ─── High Contrast Mode (WCAG AAA) ───────────────────────── */
  .hc .phone-screen { background: #000 !important; color: #FFD700 !important; }
  .hc .top-bar { background: #000 !important; border-bottom: 2px solid #FFD700 !important; }
  .hc .status-bar { color: #FFD700 !important; }
  .hc .bottom-nav { background: #000 !important; border-top: 2px solid #FFD700 !important; }
  .hc .nav-btn { color: #FFD700 !important; opacity: 0.7; }
  .hc .nav-btn.active { background: #FFD700 !important; color: #000 !important; opacity: 1; font-weight: 900; }
  .hc .card, .hc .section-card, .hc .action-card { background: #111 !important; border: 2px solid #FFD700 !important; box-shadow: none !important; color: #FFD700 !important; }
  .hc .screen-body { color: #FFD700 !important; }
  .hc .chip { background: #FFD700 !important; color: #000 !important; border-color: #000 !important; font-weight: 900; }
  .hc .btn-primary { background: #FFD700 !important; color: #000 !important; font-weight: 900; box-shadow: 0 0 20px rgba(255,215,0,0.5) !important; }
  .hc .btn-ghost { border: 2px solid #FFD700 !important; color: #FFD700 !important; }
  .hc input, .hc textarea { background: #000 !important; border: 2px solid #FFD700 !important; color: #FFD700 !important; }
  .hc .badge { background: #FFD700 !important; color: #000 !important; font-weight: 900; }
  .hc .infobox { background: #111 !important; border: 2px solid #FFD700 !important; color: #FFD700 !important; }
  .hc .voice-btn { background: #FFD700 !important; color: #000 !important; box-shadow: 0 0 0 16px rgba(255,215,0,.3) !important; }
  .hc .action-title, .hc .action-sub, .hc h1, .hc h2, .hc h3, .hc h4 { color: #FFD700 !important; }

  /* ─── Large Text Mode ─────────────────────────────────────── */
  .lg .screen-body, .lg button, .lg input { font-size: 1.15rem !important; }
  .lg h1 { font-size: 2.1rem !important; }
  .lg h2 { font-size: 1.6rem !important; }
  .lg h3 { font-size: 1.35rem !important; }

  /* ─── Top Bar ─────────────────────────────────────────────── */
  .top-bar { flex-shrink: 0; background: rgba(11, 15, 25, 0.8);
    border-bottom: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(20px); position: relative; z-index: 30; }
  .status-bar { display: flex; justify-content: space-between; align-items: center;
    padding: 16px 22px 2px; font-size: 11px; font-weight: 700; color: #94a3b8; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle; }
  .status-dot.online { background: #10b981; box-shadow: 0 0 10px #10b981; }
  .status-dot.local { background: #3b82f6; animation: pulse 1.5s infinite; }
  
  .app-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 12px; }
  .app-logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon { width: 38px; height: 38px; border-radius: 14px;
    background: linear-gradient(135deg, #3b82f6, #6366f1); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 18px; box-shadow: 0 4px 16px rgba(59,130,246,0.4);
    border: 1px solid rgba(255,255,255,0.2); }
  .logo-text h1 { font-size: 16.5px; font-weight: 900; color: #fff; line-height: 1; letter-spacing: -.4px; }
  .logo-text span { font-size: 10px; color: #94a3b8; font-weight: 600; letter-spacing: 0.02em; }
  
  .top-controls { display: flex; align-items: center; gap: 6px; }
  .tc-btn { width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center;
    justify-content: center; font-size: 15px; color: #cbd5e1; transition: all .2s ease;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); }
  .tc-btn:active { transform: scale(.92); }
  .tc-btn.active { background: rgba(59,130,246,0.25); color: #60a5fa; border-color: #3b82f6; }
  .tc-btn.hc-active { background: #FFD700; color: #000; border-color: #FFD700; font-weight: 900; }
  .lang-btn { height: 32px; padding: 0 12px; border-radius: 11px; border: 1px solid rgba(255,255,255,0.15);
    font-size: 11px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,0.08); backdrop-filter: blur(8px); }

  /* ─── Screen Body ─────────────────────────────────────────── */
  .screen-body { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
    position: relative; z-index: 10; }

  /* ─── Bottom Nav (Glass Toolbar) ──────────────────────────── */
  .bottom-nav { flex-shrink: 0; background: rgba(11, 15, 25, 0.85);
    border-top: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(20px); padding: 8px 4px 6px; z-index: 30; }
  .nav-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 0 4px; }
  .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 6px 2px 5px; border-radius: 14px; color: #64748b; transition: all .2s cubic-bezier(0.4, 0, 0.2, 1); gap: 3px; }
  .nav-btn.active { background: rgba(59,130,246,0.18); color: #60a5fa; font-weight: 800; transform: translateY(-1px); border: 1px solid rgba(59,130,246,0.3); }
  .nav-label { font-size: 9px; font-weight: 700; text-align: center; line-height: 1; }
  .nav-home-bar { width: 100px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3);
    margin: 8px auto 0; opacity: .8; }

  /* ─── Glass Cards & Primitives ────────────────────────────── */
  .screen-pad { padding: 18px 16px 14px; display: flex; flex-direction: column; gap: 16px; min-height: 100%; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    font-weight: 800; color: #cbd5e1; padding: 7px 14px; border-radius: 12px; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(8px); }
  .row-between { display: flex; align-items: center; justify-content: space-between; }
  
  .badge { display: inline-flex; align-items: center; padding: 4px 12px;
    border-radius: 99px; font-size: 10px; font-weight: 900; letter-spacing: .06em;
    text-transform: uppercase; border: 1px solid transparent; }
  .badge-blue { background: rgba(37,99,235,0.2); color: #60a5fa; border-color: rgba(37,99,235,0.4); }
  .badge-green { background: rgba(16,185,129,0.2); color: #34d399; border-color: rgba(16,185,129,0.4); }
  .badge-amber { background: rgba(245,158,11,0.2); color: #fbbf24; border-color: rgba(245,158,11,0.4); }
  .badge-purple { background: rgba(139,92,246,0.2); color: #c084fc; border-color: rgba(139,92,246,0.4); }
  .badge-indigo { background: rgba(99,102,241,0.2); color: #a5b4fc; border-color: rgba(99,102,241,0.4); }
  
  .card { background: rgba(18, 24, 38, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px;
    padding: 18px; backdrop-filter: blur(20px); box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5); }
  .section-card { background: rgba(18, 24, 38, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 16px; backdrop-filter: blur(16px); }
  
  .btn-primary { display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 16px 20px; border-radius: 18px; font-weight: 800; font-size: 14.5px;
    background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%); color: #fff;
    box-shadow: 0 10px 25px -5px rgba(37,99,235,0.5); border: 1px solid rgba(255,255,255,0.2);
    transition: all .25s cubic-bezier(0.4, 0, 0.2, 1); width: 100%; letter-spacing: -0.2px; }
  .btn-primary:active { transform: scale(.97); box-shadow: 0 5px 12px -2px rgba(37,99,235,0.5); }
  
  .btn-ghost { display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 12px 18px; border-radius: 16px; font-weight: 700; font-size: 13px;
    border: 1px solid rgba(255,255,255,0.15); color: #cbd5e1; transition: all .2s; background: rgba(255,255,255,0.04); }
  .btn-ghost:active { transform: scale(.97); background: rgba(255,255,255,0.08); }
  
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3);
    border-radius: 99px; padding: 5px 14px; font-size: 11px; font-weight: 800; color: #60a5fa; }
  
  .infobox { border-radius: 16px; padding: 14px 16px; border: 1px solid; font-size: 12px; line-height: 1.55; }
  .infobox-blue { background: rgba(30, 58, 138, 0.3); border-color: rgba(59, 130, 246, 0.4); color: #93c5fd; }
  .infobox-green { background: rgba(6, 78, 59, 0.3); border-color: rgba(16, 185, 129, 0.4); color: #6ee7b7; }
  .infobox-amber { background: rgba(120, 53, 15, 0.3); border-color: rgba(245, 158, 11, 0.4); color: #fde047; }
  .infobox-purple { background: rgba(88, 28, 135, 0.3); border-color: rgba(168, 85, 247, 0.4); color: #e9d5ff; }
  
  .progress-track { background: rgba(255,255,255,0.1); border-radius: 99px; height: 10px; overflow: hidden; padding: 2px; }
  .progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #3b82f6, #818cf8);
    transition: width .4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 12px rgba(59,130,246,0.6); }
  
  .section-label { font-size: 11px; font-weight: 900; letter-spacing: .08em;
    text-transform: uppercase; color: #64748b; margin-bottom: 8px; }

  /* ─── Hero Pulsing Mic Button ─────────────────────────────── */
  .voice-hero-container { position: relative; display: flex; align-items: center; justify-content: center; padding: 14px 0; }
  .voice-btn { width: 120px; height: 120px; border-radius: 50%; display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    background: linear-gradient(135deg, #3b82f6 0%, #4f46e5 100%); color: #fff;
    box-shadow: 0 15px 40px rgba(59,130,246,0.5), inset 0 0 0 2px rgba(255,255,255,0.3);
    transition: all .3s cubic-bezier(0.4, 0, 0.2, 1); font-size: 11px; font-weight: 900; text-transform: uppercase;
    letter-spacing: .08em; z-index: 10; border: none; }
  .voice-btn:active { transform: scale(.92); }
  .voice-btn.listening { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    box-shadow: 0 15px 40px rgba(239,68,68,0.6), inset 0 0 0 2px rgba(255,255,255,0.4); }
  .voice-btn svg { width: 46px; height: 46px; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3)); }

  @keyframes pulse-ring-pro {
    0% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 0 0 rgba(59,130,246,0.5); }
    70% { transform: scale(1.25); opacity: 0; box-shadow: 0 0 0 35px rgba(59,130,246,0); }
    100% { transform: scale(0.95); opacity: 0; box-shadow: 0 0 0 0 rgba(59,130,246,0); }
  }
  @keyframes pulse-ring-red-pro {
    0% { transform: scale(0.95); opacity: 0.9; box-shadow: 0 0 0 0 rgba(239,68,68,0.6); }
    70% { transform: scale(1.35); opacity: 0; box-shadow: 0 0 0 40px rgba(239,68,68,0); }
    100% { transform: scale(0.95); opacity: 0; box-shadow: 0 0 0 0 rgba(239,68,68,0); }
  }
  .voice-ring { position: absolute; inset: -10px; border-radius: 50%; border: 2px solid rgba(59,130,246,0.4); pointer-events: none; }
  .voice-btn:not(.listening) + .voice-ring { animation: pulse-ring-pro 2.4s infinite ease-out; }
  .voice-btn.listening + .voice-ring { animation: pulse-ring-red-pro 1.2s infinite ease-out; border-color: rgba(239,68,68,0.5); }

  /* ─── Toggle Switch (iOS Pro Style) ───────────────────────── */
  .toggle { position: relative; width: 48px; height: 28px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; inset: 0; border-radius: 99px;
    background: rgba(255,255,255,0.15); transition: .3s ease; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
  .toggle-slider::before { content: ''; position: absolute; width: 22px; height: 22px;
    left: 3px; bottom: 2px; border-radius: 50%; background: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,.4); transition: .3s ease; }
  .toggle input:checked + .toggle-slider { background: #3b82f6; border-color: #60a5fa; }
  .toggle input:checked + .toggle-slider::before { transform: translateX(20px); }

  /* ─── Camera Viewport (HUD Frame) ─────────────────────────── */
  .cam-viewport { width: 100%; height: 240px; background: #000; border-radius: 26px;
    overflow: hidden; position: relative; display: flex; align-items: center;
    justify-content: center; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
  .cam-viewport video { width: 100%; height: 100%; object-fit: cover; }
  .cam-label { position: absolute; top: 14px; left: 14px;
    background: rgba(11,15,25,0.85); backdrop-filter: blur(12px); border: 1px solid rgba(16,185,129,0.4);
    border-radius: 20px; padding: 5px 14px; font-size: 10px; font-weight: 900; color: #34d399;
    display: flex; align-items: center; gap: 7px; letter-spacing: 0.05em; }
  .cam-pulse { width: 8px; height: 8px; border-radius: 50%; background: #34d399;
    box-shadow: 0 0 10px #34d399; animation: pulse 1s infinite; }

  /* Laser Line Scanner */
  .scanner-line { position: absolute; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, #3b82f6, #60a5fa, #3b82f6, transparent);
    box-shadow: 0 0 20px #3b82f6; animation: scan 2.2s ease-in-out infinite; z-index: 10; }
  @keyframes scan { 0% { top: 12%; } 50% { top: 88%; } 100% { top: 12%; } }

  /* ─── Bento Grid Action Cards ─────────────────────────────── */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .action-card { background: rgba(18, 24, 38, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 22px;
    padding: 16px; text-align: left; transition: all .25s cubic-bezier(0.4, 0, 0.2, 1); display: flex;
    flex-direction: column; gap: 8px; backdrop-filter: blur(16px); position: relative; overflow: hidden; }
  .action-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.25); }
  .action-card:active { transform: scale(.96); }
  .action-card.featured { border-color: rgba(59,130,246,0.5); background: linear-gradient(180deg, rgba(37,99,235,0.2) 0%, rgba(18,24,38,0.8) 100%); box-shadow: 0 12px 30px -5px rgba(37,99,235,0.3); }
  .action-icon { width: 44px; height: 44px; border-radius: 16px; display: flex;
    align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); }
  .action-icon svg { width: 22px; height: 22px; color: #fff; }
  .action-title { font-size: 15px; font-weight: 900; color: #fff; line-height: 1.1; letter-spacing: -0.3px; }
  .action-sub { font-size: 11px; color: #94a3b8; line-height: 1.35; font-weight: 500; }
  .action-link { font-size: 11px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .06em; margin-top: 4px; display: flex; align-items: center; gap: 4px; }

  /* ─── Modern Input Fields ─────────────────────────────────── */
  .field-wrap { position: relative; }
  .field-input { width: 100%; padding: 15px 50px 15px 18px; border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.15); font-size: 15px; font-weight: 600; color: #fff;
    background: rgba(255, 255, 255, 0.06); outline: none; transition: all .2s ease; backdrop-filter: blur(8px); }
  .field-input:focus { border-color: #3b82f6; background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 0 0 4px rgba(59,130,246,.25); }
  .field-mic-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; border-radius: 12px; background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 12px rgba(37,99,235,0.4); border: none; }
  .field-mic-btn.recording { background: #ef4444; animation: pulse 0.7s infinite; }

  /* ─── Spinner & Confetti ──────────────────────────────────── */
  .spinner { width: 44px; height: 44px; border: 4px solid rgba(255,255,255,.1);
    border-top-color: #3b82f6; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #confetti-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 100; border-radius: 46px; }

  /* ─── Gesture Buttons ─────────────────────────────────────── */
  .gesture-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .gesture-btn { padding: 12px 4px; border-radius: 14px; text-align: center;
    border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); transition: all .2s; }
  .gesture-btn.active { background: #10b981; color: #fff; border-color: #34d399; box-shadow: 0 6px 18px rgba(16,185,129,0.4); }
  .gesture-btn:active { transform: scale(.92); }
  .gesture-en { font-size: 11px; font-weight: 900; }
  .gesture-hi { font-size: 9px; opacity: .8; font-weight: 600; }

  /* ─── Target Object Buttons ───────────────────────────────── */
  .obj-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .obj-btn { padding: 13px 6px; border-radius: 16px; text-align: center;
    border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); transition: all .2s; }
  .obj-btn.active { background: #f59e0b; color: #000; border-color: #fbbf24; font-weight: 900; box-shadow: 0 6px 18px rgba(245,158,11,0.4); }
  .obj-btn:active { transform: scale(.92); }
  .obj-en { font-size: 12px; font-weight: 900; }
  .obj-hi { font-size: 10px; opacity: .85; font-weight: 600; }

  /* ─── Profile Rows ────────────────────────────────────────── */
  .pref-row { display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .pref-row:last-child { border-bottom: none; }
  .pref-label { font-size: 14px; font-weight: 800; color: #fff; }
  .pref-sub { font-size: 11px; color: #94a3b8; font-weight: 500; }

  /* ─── Toast Notifications ─────────────────────────────────── */
  .toast { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.95); color: #fff; font-size: 13px; font-weight: 800;
    padding: 12px 24px; border-radius: 99px; white-space: nowrap; z-index: 200;

function speak(text) {
  if (!state.audio || !state.synth) return;
  try {
    state.synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = state.lang === 'Hindi' ? 'hi-IN' : 'en-US';
    u.rate = 0.95;
    const voices = state.synth.getVoices();
    const v = voices.find(vv => vv.lang.startsWith(state.lang === 'Hindi' ? 'hi' : 'en'));
    if (v) u.voice = v;
    state.synth.speak(u);
  } catch(_) {}
}

function startListening(onResult, onEnd, onError) {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) { onError?.('not_supported'); onEnd?.(); return; }
  try {
    if (state.recognition) { state.recognition.abort(); }
    const r = new SpeechRec();
    r.lang = state.lang === 'Hindi' ? 'hi-IN' : 'en-US';
    r.continuous = false; r.interimResults = false;
    r.onresult = e => onResult(e.results[0][0].transcript);
    r.onerror = e => { onError?.(e.error); onEnd?.(); };
    r.onend = () => onEnd?.();
    state.recognition = r;
    r.start();
  } catch(e) { onError?.('mic_error'); onEnd?.(); }
}

  return res.json();
}

function fireConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
  const particles = Array.from({length:110}, () => ({
    x: canvas.width/2 + (Math.random()-0.5)*240,
    y: canvas.height*0.5,
    vx: (Math.random()-0.5)*12,
    vy: -(Math.random()*10+5),
    r: Math.random()*7+3,
    color: ['#3b82f6','#10b981','#f59e0b','#6366f1','#ec4899','#06b6d4','#8b5cf6'][Math.floor(Math.random()*7)],
    life: 1,
  }));
  let frame;
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p => {
      p.x += p.vx; p.vy += 0.3; p.y += p.vy; p.life -= 0.014;
      if (p.life <= 0) return;
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (particles.some(p=>p.life>0)) frame = requestAnimationFrame(draw);
    else { ctx.clearRect(0,0,canvas.width,canvas.height); }
  }
  cancelAnimationFrame(frame);
  draw();
}

  startListening(

    () => { state.listening = false; render(); },

      const q = state.lang==='Hindi' ? 'छात्रवृत्ति फ़ॉर्म भरने में मदद करो' : 'Help me fill this scholarship form';

};

function processIntent(query) {
  state.listening = false;
  const r = classifyIntent(query);
  state.voiceStatus = t(`सुना: "${query}"`, `Heard: "${query}"`);
  state.intentResult = r.intent;
  haptics.success();
  speak(state.lang==='Hindi' ? `समझा गया: ${r.intent}` : `Intent: ${r.intent}`);
  render();
  setTimeout(() => {
    if (r.intent === 'FORM_COMPLETION') navigate('complete');
    else if (r.intent === 'UNDERSTAND_DOCUMENT') navigate('read');
    else if (r.intent === 'COMMUNICATE') navigate('talk');
    else navigate('see');
  }, 1000);
}

function bindComplete() {
  const flow = state.formFlow;
  if (!flow) return;
  const step = flow.steps[state.formStep];
  window.speakStep = () => { haptics.click(); speak(step.prompt); };
  window.dictateStep = () => {
    haptics.click();
    const btn = document.getElementById('fieldMicBtn');
    btn?.classList.add('recording');
    startListening(
      t => { document.getElementById('stepInput').value = t; btn?.classList.remove('recording'); haptics.confirm(); },
      () => btn?.classList.remove('recording'),
      () => {
        btn?.classList.remove('recording');
        const d = demoAnswers[state.formStep];
        document.getElementById('stepInput').value = state.lang==='Hindi' ? d.hi : d.en;
      }
    );
  };
  window.submitStep = () => {
    haptics.confirm();
    const inp = document.getElementById('stepInput');
    const val = (inp?.value||'').trim() || (state.lang==='Hindi'?demoAnswers[state.formStep].hi:demoAnswers[state.formStep].en);
    state.formAnswers[step.fi] = val;
    if (state.formStep+1 < flow.total_steps) {
      state.formStep++;
      render();
      speak(flow.steps[state.formStep].prompt);
    } else {
      state.formVerified = true;
      state.verifyToken = 'VERIFIED_SAHAYAK_' + Math.floor(100000+Math.random()*900000);
      haptics.celebrate();
      render();
      fireConfetti();
      speak(t('बधाई हो! फ़ॉर्म सफलतापूर्वक सत्यापित।','Congratulations! Scholarship form fully verified.'));
    }
  };
  window.resetForm = () => {
    haptics.click(); state.formFlow = null; state.formVerified = false;
    state.formStep = 0; state.formAnswers = {}; render();
  };
  if (!state.formFlow._spoken) {
    state.formFlow._spoken = true;
    setTimeout(() => speak(step.prompt), 400);
  }
}

window.toggleWebcam = async function() {
  if (state.webcamStream) {
    state.webcamStream.getTracks().forEach(t=>t.stop());
    state.webcamStream = null;
    const v = document.getElementById('camVideo');
    if (v) { v.style.display = 'none'; v.srcObject = null; }
    const lv = document.getElementById('landmarkView');
    if (lv) lv.style.display = 'flex';
  } else {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
      state.webcamStream = stream;
      const v = document.getElementById('camVideo');
      const lv = document.getElementById('landmarkView');
      if (v) { v.srcObject = stream; v.style.display = 'block'; }
      if (lv) lv.style.display = 'none';
    } catch(e) { showToast(t('कैमरा उपलब्ध नहीं','Camera not available')); }
  }
};

            <div class="pref-sub">${p.sub}</div>
          </div>
          <label class="toggle" onclick="${p.fn}()">
            <input type="checkbox" ${p.val?'checked':''} onclick="event.stopPropagation()">
            <span class="toggle-slider"></span>
          </label>
        </div>`).join('')}
    </div>

    <!-- Active Preference Chips -->
    <div class="section-card">
      <div class="section-label">${t('इंटरैक्शन प्राथमिकताएं (सक्रिय)','Active Preferences')}</div>
      <div class="chip-row">
        <span class="chip">${t('आवाज़ प्राथमिकता','Voice First')}</span>
        <span class="chip">${t('एक समय में एक चरण','1-Step-at-a-Time')}</span>
        <span class="chip">${t('सरल भाषा','Simplified Language')}</span>
        <span class="chip">${t('हैप्टिक पुष्टि','Haptic Confirmation')}</span>
        <span class="chip">${t('बड़े बटन','Large Touch Targets')}</span>
      </div>
    </div>

    <button class="btn-primary" onclick="saveProfile()">
      ${ICON.sparkle} ${t('प्राथमिकताएं सहेजें','Save Twin Profile')}
    </button>
  </div>`;
}

window.setLang = function(lang) { haptics.click(); state.lang = lang; applyTheme(); render(); };
window.saveProfile = function() {
  haptics.success();
  showToast(state.lang==='Hindi' ? '✓ प्रोफ़ाइल सहेजी गई!' : '✓ Twin Profile Saved!');
  setTimeout(() => navigate('home'), 900);
};

function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.getElementById('phoneScreen').appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
async function init() {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit',hour12:false});
  document.querySelector('.status-bar span').textContent = timeStr;

  applyTheme();
  renderNav();
  render();
  checkBackend();

  setTimeout(() => {
    if (state.screen === 'home') {
      speak(state.lang==='Hindi'
        ? 'सहायक AI में आपका स्वागत है। मैं आपकी क्या मदद करूँ?'
        : 'Welcome to Sahayak AI. How can I assist you today?');
    }
  }, 700);
}

init();
</script>
</body>
</html>

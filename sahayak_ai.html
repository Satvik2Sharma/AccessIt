<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#2563eb" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="description" content="Sahayak AI — Intent-Aware Personal Accessibility Copilot" />
<title>Sahayak AI (सहायक AI) — Accessibility Copilot</title>
<style>
  /* ─── Reset & Base ────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; -webkit-tap-highlight-color: transparent; user-select: none; }
  button { cursor: pointer; border: none; background: none; font-family: inherit; }
  input, textarea { font-family: inherit; }
  ::-webkit-scrollbar { display: none; }

  /* ─── Phone Frame ─────────────────────────────────────────── */
  #root { display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 16px; }
  .phone-frame { position: relative; width: 100%; max-width: 400px;
    height: min(860px, 96vh); background: #1e293b; border-radius: 48px;
    padding: 12px; box-shadow: 0 30px 80px -10px rgba(0,0,0,.8),
      0 0 0 6px #334155, inset 0 0 0 1px #475569; }
  .phone-screen { width: 100%; height: 100%; border-radius: 38px; overflow: hidden;
    display: flex; flex-direction: column; background: #f8fafc;
    transition: background 0.2s, color 0.2s; position: relative; }
  .phone-pill { position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    width: 112px; height: 24px; background: #000; border-radius: 12px; z-index: 20;
    display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; }
  .phone-pill-dot { width: 10px; height: 10px; border-radius: 50%; background: #0f172a;
    box-shadow: inset 0 0 0 2px #1e293b; }

  /* ─── High Contrast Mode ──────────────────────────────────── */
  .hc .phone-screen { background: #000; color: #FFD700; }
  .hc .top-bar { background: #000 !important; border-bottom-color: #FFD700 !important; }
  .hc .status-bar { color: #FFD700 !important; }
  .hc .bottom-nav { background: #000 !important; border-top-color: #FFD700 !important; }
  .hc .nav-btn { color: #FFD700 !important; }
  .hc .nav-btn.active { background: #FFD700 !important; color: #000 !important; }
  .hc .card { background: #111 !important; border-color: #FFD700 !important; }
  .hc .screen-body { color: #FFD700; }
  .hc .text-subtle { color: #fff !important; }
  .hc .chip { background: #FFD700; color: #000; border-color: #000; }
  .hc .btn-primary { background: #FFD700 !important; color: #000 !important; font-weight: 900; }
  .hc .btn-ghost { border-color: #FFD700; color: #FFD700; }
  .hc .text-muted { color: #aaa !important; }
  .hc input, .hc textarea { background: #000; border-color: #FFD700; color: #FFD700; }
  .hc .badge { background: #FFD700; color: #000; }
  .hc .section-card { background: #111; border: 2px solid #FFD700; }
  .hc .heatmap-dot-red { box-shadow: 0 0 0 4px rgba(255,0,0,.3) !important; }
  .hc .heatmap-dot-yellow { box-shadow: 0 0 0 4px rgba(255,215,0,.3) !important; }
  .hc .heatmap-dot-green { box-shadow: 0 0 0 4px rgba(0,255,100,.3) !important; }
  .hc .tag { background: transparent; border: 1px solid #FFD700; color: #FFD700; }
  .hc .infobox { background: #111; border-color: #FFD700; }
  .hc .progress-track { background: #333; }
  .hc .progress-fill { background: #FFD700; }
  .hc .cam-viewport { border-color: #FFD700; }
  .hc .voice-btn { background: #FFD700 !important; color: #000 !important;
    box-shadow: 0 0 0 12px rgba(255,215,0,.18) !important; }
  .hc .nav-label { color: #FFD700; }

  /* ─── Large Text Mode ─────────────────────────────────────── */
  .lg .screen-body, .lg button, .lg input { font-size: 1.12rem; }
  .lg h1 { font-size: 2rem !important; }
  .lg h2 { font-size: 1.55rem !important; }
  .lg h3 { font-size: 1.3rem !important; }
  .lg .label-sm { font-size: 0.8rem !important; }
  .lg .text-xs { font-size: 0.78rem !important; }

  /* ─── Top Bar ─────────────────────────────────────────────── */
  .top-bar { flex-shrink: 0; background: rgba(255,255,255,.96);
    border-bottom: 1px solid #e2e8f0; backdrop-filter: blur(8px); position: relative; z-index: 10; }
  .status-bar { display: flex; justify-content: space-between; align-items: center;
    padding: 6px 18px 0; font-size: 11px; font-weight: 700; color: #64748b; }
  .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 4px; vertical-align: middle; }
  .status-dot.online { background: #22c55e; }
  .status-dot.local { background: #3b82f6; animation: pulse 1.5s infinite; }
  .app-bar { display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px 10px; }
  .app-logo { display: flex; align-items: center; gap: 8px; }
  .logo-icon { width: 32px; height: 32px; border-radius: 10px;
    background: linear-gradient(135deg, #2563eb, #6366f1); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 15px; box-shadow: 0 2px 8px rgba(37,99,235,.35); }
  .logo-text h1 { font-size: 15px; font-weight: 900; color: #0f172a; line-height: 1; letter-spacing: -.3px; }
  .logo-text span { font-size: 10px; color: #64748b; }
  .top-controls { display: flex; align-items: center; gap: 2px; }
  .tc-btn { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center;
    justify-content: center; font-size: 16px; color: #475569; transition: all .15s; }
  .tc-btn:active { transform: scale(.9); }
  .tc-btn.active { background: #dbeafe; color: #2563eb; }
  .tc-btn.hc-active { background: #FFD700; color: #000; border-radius: 8px; }
  .lang-btn { height: 28px; padding: 0 8px; border-radius: 8px; border: 1.5px solid #cbd5e1;
    font-size: 11px; font-weight: 700; color: #475569; display: flex; align-items: center; gap: 4px; }

  /* ─── Screen Body ─────────────────────────────────────────── */
  .screen-body { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }

  /* ─── Bottom Nav ──────────────────────────────────────────── */
  .bottom-nav { flex-shrink: 0; background: rgba(255,255,255,.96);
    border-top: 1px solid #e2e8f0; backdrop-filter: blur(8px); padding: 4px 0 2px; }
  .nav-grid { display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 2px; padding: 0 4px; }
  .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 4px 2px 3px; border-radius: 10px; color: #64748b; transition: all .15s; gap: 1px; }
  .nav-btn.active { background: #eff6ff; color: #2563eb; }
  .nav-btn svg { width: 19px; height: 19px; }
  .nav-label { font-size: 9px; font-weight: 700; text-align: center; line-height: 1; }
  .nav-home-bar { width: 96px; height: 4px; border-radius: 2px; background: #cbd5e1;
    margin: 4px auto 0; opacity: .6; }

  /* ─── Common Components ───────────────────────────────────── */
  .screen-pad { padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 12px; min-height: 100%; }
  .back-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 12px;
    font-weight: 700; color: #475569; padding: 6px 8px; border-radius: 8px; }
  .back-btn:hover { background: #f1f5f9; }
  .row-between { display: flex; align-items: center; justify-content: space-between; }
  .badge { display: inline-flex; align-items: center; padding: 3px 10px;
    border-radius: 99px; font-size: 10px; font-weight: 900; letter-spacing: .06em;
    text-transform: uppercase; }
  .badge-blue { background: #dbeafe; color: #1d4ed8; }
  .badge-green { background: #dcfce7; color: #15803d; }
  .badge-amber { background: #fef3c7; color: #92400e; }
  .badge-purple { background: #ede9fe; color: #6d28d9; }
  .badge-indigo { background: #e0e7ff; color: #4338ca; }
  .card { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 18px;
    padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
  .section-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 14px; }
  .btn-primary { display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 13px 16px; border-radius: 14px; font-weight: 700; font-size: 14px;
    background: #2563eb; color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,.3);
    transition: all .15s; width: 100%; }
  .btn-primary:active { transform: scale(.97); }
  .btn-ghost { display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 14px; border-radius: 12px; font-weight: 600; font-size: 12px;
    border: 1.5px solid #e2e8f0; color: #475569; transition: all .15s; }
  .btn-ghost:active { transform: scale(.97); }
  .tag { background: #f1f5f9; border-radius: 99px; padding: 3px 10px;
    font-size: 11px; font-weight: 700; color: #475569; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: rgba(37,99,235,.12); border: 1px solid rgba(37,99,235,.25);
    border-radius: 99px; padding: 3px 10px; font-size: 11px; font-weight: 700; color: #2563eb; }
  .infobox { border-radius: 12px; padding: 10px 12px; border: 1.5px solid; font-size: 11px; line-height: 1.5; }
  .infobox-blue { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
  .infobox-green { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
  .infobox-amber { background: #fffbeb; border-color: #fde68a; color: #92400e; }
  .infobox-purple { background: #faf5ff; border-color: #e9d5ff; color: #6b21a8; }
  .progress-track { background: #e2e8f0; border-radius: 99px; height: 9px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 99px; background: #2563eb;
    transition: width .35s ease; }
  .section-label { font-size: 11px; font-weight: 900; letter-spacing: .06em;
    text-transform: uppercase; color: #94a3b8; margin-bottom: 4px; }
  .divider { border: none; border-top: 1px solid #f1f5f9; margin: 4px 0; }

  /* ─── Mic Button ──────────────────────────────────────────── */
  .voice-btn { width: 108px; height: 108px; border-radius: 50%; display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    background: linear-gradient(135deg, #2563eb, #6366f1); color: #fff;
    box-shadow: 0 0 0 14px rgba(37,99,235,.15), 0 8px 24px rgba(37,99,235,.4);
    transition: all .2s; font-size: 11px; font-weight: 900; text-transform: uppercase;
    letter-spacing: .04em; }
  .voice-btn:active { transform: scale(.93); }
  .voice-btn.listening { background: #ef4444;
    box-shadow: 0 0 0 18px rgba(239,68,68,.15), 0 8px 24px rgba(239,68,68,.4); }
  .voice-btn svg { width: 42px; height: 42px; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  @keyframes pulse-ring { 0%{transform:scale(.95); box-shadow:0 0 0 0 rgba(37,99,235,.7)}
    70%{transform:scale(1.04); box-shadow:0 0 0 22px rgba(37,99,235,0)}
    100%{transform:scale(.95); box-shadow:0 0 0 0 rgba(37,99,235,0)} }
  @keyframes pulse-ring-red { 0%{transform:scale(.95); box-shadow:0 0 0 0 rgba(239,68,68,.7)}
    70%{transform:scale(1.04); box-shadow:0 0 0 26px rgba(239,68,68,0)}
    100%{transform:scale(.95); box-shadow:0 0 0 0 rgba(239,68,68,0)} }
  .voice-btn:not(.listening) { animation: pulse-ring 2.2s infinite; }
  .voice-btn.listening { animation: pulse-ring-red 1.1s infinite; }

  /* ─── Toggle Switch ───────────────────────────────────────── */
  .toggle { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; inset: 0; border-radius: 99px;
    background: #e2e8f0; transition: .2s; cursor: pointer; }
  .toggle-slider::before { content: ''; position: absolute; width: 18px; height: 18px;
    left: 3px; bottom: 3px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: .2s; }
  .toggle input:checked + .toggle-slider { background: #2563eb; }
  .toggle input:checked + .toggle-slider::before { transform: translateX(18px); }

  /* ─── Camera Viewport ─────────────────────────────────────── */
  .cam-viewport { width: 100%; height: 220px; background: #000; border-radius: 20px;
    overflow: hidden; position: relative; display: flex; align-items: center;
    justify-content: center; border: 2px solid #1e293b; }
  .cam-viewport video { width: 100%; height: 100%; object-fit: cover; }
  .cam-label { position: absolute; top: 10px; left: 10px;
    background: rgba(0,0,0,.8); border: 1px solid #22c55e; border-radius: 20px;
    padding: 4px 10px; font-size: 10px; font-weight: 900; color: #4ade80;
    display: flex; align-items: center; gap: 6px; }
  .cam-pulse { width: 7px; height: 7px; border-radius: 50%; background: #4ade80;
    animation: pulse 1s infinite; }

  /* ─── Heatmap Dot ─────────────────────────────────────────── */
  .heatmap-dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; margin-top: 2px; }
  .heatmap-dot-red { background: #ef4444; box-shadow: 0 0 0 4px #fee2e2; }
  .heatmap-dot-yellow { background: #f59e0b; box-shadow: 0 0 0 4px #fef3c7; }
  .heatmap-dot-green { background: #22c55e; box-shadow: 0 0 0 4px #dcfce7; }

  /* ─── Grid ────────────────────────────────────────────────── */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .action-card { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 18px;
    padding: 14px; text-align: left; transition: all .15s; display: flex;
    flex-direction: column; gap: 6px; }
  .action-card:active { transform: scale(.97); }
  .action-card.featured { border-color: #93c5fd; border-width: 2px; box-shadow: 0 2px 12px rgba(37,99,235,.1); }
  .action-icon { width: 38px; height: 38px; border-radius: 12px; display: flex;
    align-items: center; justify-content: center; }
  .action-icon svg { width: 22px; height: 22px; color: #fff; }
  .action-title { font-size: 15px; font-weight: 900; color: #0f172a; line-height: 1.1; }
  .action-sub { font-size: 11px; color: #64748b; line-height: 1.35; }
  .action-link { font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; margin-top: 4px; }

  /* ─── Inline SVG Icon System ──────────────────────────────── */
  svg.icon { display: inline-block; vertical-align: middle;
    fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round;
    stroke-linejoin: round; }

  /* ─── Form Input ──────────────────────────────────────────── */
  .field-wrap { position: relative; }
  .field-input { width: 100%; padding: 12px 44px 12px 14px; border-radius: 12px;
    border: 1.5px solid #cbd5e1; font-size: 14px; font-weight: 600; color: #0f172a;
    background: #f8fafc; outline: none; transition: all .15s; }
  .field-input:focus { border-color: #2563eb; background: #fff;
    box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .field-mic-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; border-radius: 8px; background: #2563eb; color: #fff;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .field-mic-btn.recording { background: #ef4444; animation: pulse 0.7s infinite; }

  /* ─── Spinner ─────────────────────────────────────────────── */
  .spinner { width: 40px; height: 40px; border: 4px solid rgba(37,99,235,.2);
    border-top-color: #2563eb; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── Confetti canvas ─────────────────────────────────────── */
  #confetti-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 100; border-radius: 38px; }

  /* ─── Gesture Selector ────────────────────────────────────── */
  .gesture-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .gesture-btn { padding: 8px 4px; border-radius: 10px; text-align: center;
    border: 1.5px solid #e2e8f0; background: #fff; transition: all .15s; }
  .gesture-btn.active { background: #16a34a; color: #fff; border-color: #16a34a; }
  .gesture-btn:active { transform: scale(.92); }
  .gesture-en { font-size: 11px; font-weight: 900; }
  .gesture-hi { font-size: 9px; opacity: .75; }

  /* ─── Object Selector ─────────────────────────────────────── */
  .obj-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .obj-btn { padding: 10px 4px; border-radius: 12px; text-align: center;
    border: 1.5px solid #e2e8f0; background: #fff; transition: all .15s; }
  .obj-btn.active { background: #d97706; color: #fff; border-color: #d97706; }
  .obj-btn:active { transform: scale(.92); }
  .obj-en { font-size: 12px; font-weight: 900; }
  .obj-hi { font-size: 10px; opacity: .75; }

  /* ─── Profile toggle row ──────────────────────────────────── */
  .pref-row { display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid #f1f5f9; }
  .pref-row:last-child { border-bottom: none; }
  .pref-label { font-size: 13px; font-weight: 700; color: #0f172a; }
  .pref-sub { font-size: 11px; color: #94a3b8; }

  /* ─── Toast ───────────────────────────────────────────────── */
  .toast { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: #1e293b; color: #fff; font-size: 13px; font-weight: 700;
    padding: 10px 20px; border-radius: 99px; white-space: nowrap; z-index: 200;
    box-shadow: 0 4px 12px rgba(0,0,0,.3); animation: toast-in .25s ease; }
  @keyframes toast-in { from{opacity:0;transform:translate(-50%,8px)} to{opacity:1;transform:translateX(-50%)} }

  /* ─── ISL Skeleton SVG ────────────────────────────────────── */
  .landmark-svg { width: 120px; height: 140px; opacity: .85; }

  /* ─── Bounding box ────────────────────────────────────────── */
  .bbox { position: absolute; border: 2.5px solid #4ade80; border-radius: 10px;
    background: rgba(74,222,128,.08); display: flex; flex-direction: column;
    justify-content: space-between; padding: 4px 5px; transition: all .5s ease; }
  .bbox-label { font-size: 9px; font-weight: 900; font-family: monospace;
    background: rgba(74,222,128,.85); color: #000; padding: 1px 4px; border-radius: 4px;
    text-transform: uppercase; }
  .bbox-conf { font-size: 9px; font-family: monospace; color: #4ade80;
    background: rgba(0,0,0,.7); padding: 1px 4px; border-radius: 4px; align-self: flex-end; }

  /* ─── Verification Certificate ────────────────────────────── */
  .cert { background: linear-gradient(135deg, #f0fdf4 0%, #eff6ff 100%);
    border: 2px solid #22c55e; border-radius: 20px; padding: 16px; }
  .cert-token { font-family: monospace; font-size: 11px; font-weight: 900;
    background: #dcfce7; color: #15803d; padding: 3px 9px; border-radius: 6px; }
  .cert-row { display: flex; justify-content: space-between; font-size: 12px;
    padding: 4px 0; border-bottom: 1px solid rgba(0,0,0,.06); }
  .cert-row:last-child { border-bottom: none; }

  /* fullscreen on narrow screens */
  @media (max-width: 440px) {
    #root { padding: 0; }
    .phone-frame { max-width: 100%; height: 100vh; border-radius: 0; padding: 0;
      background: transparent; box-shadow: none; }
    .phone-screen { border-radius: 0; }
    .phone-pill { display: none; }
  }
</style>
</head>
<body>
<div id="root">
  <div class="phone-frame" id="phoneFrame">
    <div class="phone-pill"><div class="phone-pill-dot"></div></div>
    <div class="phone-screen" id="phoneScreen">
      <!-- TOP BAR -->
      <header class="top-bar">
        <div class="status-bar" id="statusBar">
          <span>09:41</span>
          <span id="backendLabel">
            <span class="status-dot local" id="statusDot"></span>
            <span id="statusText">AI Engine Ready</span>
            &nbsp;·&nbsp;5G&nbsp;·&nbsp;100%
          </span>
        </div>
        <div class="app-bar">
          <div class="app-logo">
            <div class="logo-icon">स</div>
            <div class="logo-text">
              <h1 id="appTitle">सहायक AI</h1>
              <span>Accessibility Copilot</span>
            </div>
          </div>
          <div class="top-controls">
            <button class="tc-btn" id="audioBtn" title="Toggle Voice Guidance" onclick="toggleAudio()">🔊</button>
            <button class="tc-btn" id="hcBtn" title="Toggle High Contrast (WCAG AAA)" onclick="toggleHC()">◑</button>
            <button class="tc-btn" id="lgBtn" title="Toggle Large Text" onclick="toggleLargeText()">A</button>
            <button class="lang-btn" id="langBtn" onclick="toggleLang()">🌐 हिं</button>
          </div>
        </div>
      </header>

      <!-- SCREEN BODY -->
      <div class="screen-body" id="screenBody"></div>

      <!-- BOTTOM NAV -->
      <nav class="bottom-nav">
        <div class="nav-grid" id="navGrid"></div>
        <div class="nav-home-bar"></div>
      </nav>
    </div>
    <canvas id="confetti-canvas"></canvas>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
const state = {
  screen: 'home',
  lang: 'Hindi',   // 'Hindi' | 'English'
  hc: false,       // high contrast
  lg: true,        // large text
  audio: true,     // voice guidance
  formFlow: null,
  formStep: 0,
  formAnswers: {},
  formVerified: false,
  verifyToken: '',
  docData: null,
  docLoading: true,
  detectedSign: 'HELP',
  signCaption: 'सहायता चाहिए (I need Help)',
  signConf: 0.96,
  webcamStream: null,
  selectedObj: 'bottle',

function speak(text) {
  if (!state.audio || !state.synth) return;
  try {
    state.synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = state.lang === 'Hindi' ? 'hi-IN' : 'en-US';
    u.rate = 0.95;
    const voices = state.synth.getVoices();
    const v = voices.find(vv => vv.lang.startsWith(state.lang === 'Hindi' ? 'hi' : 'en'));
    if (v) u.voice = v;
    state.synth.speak(u);
  } catch(_) {}
}

function startListening(onResult, onEnd, onError) {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) { onError?.('not_supported'); onEnd?.(); return; }
  try {
    if (state.recognition) { state.recognition.abort(); }
    const r = new SpeechRec();
    r.lang = state.lang === 'Hindi' ? 'hi-IN' : 'en-US';
    r.continuous = false; r.interimResults = false;
    r.onresult = e => onResult(e.results[0][0].transcript);
    r.onerror = e => { onError?.(e.error); onEnd?.(); };
    r.onend = () => onEnd?.();
    state.recognition = r;
    r.start();
  } catch(e) { onError?.('mic_error'); onEnd?.(); }
}

const API = 'http://127.0.0.1:8000/api/v1';

async function apiFetch(path, opts={}) {
  if (!state.backendOk) throw new Error('backend_down');
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), 2500);
  const res = await fetch(API + path, { ...opts, signal: ctrl.signal });
  clearTimeout(id);
  if (!res.ok) throw new Error('api_error');
  return res.json();
}

async function checkBackend() {
  try {
    await apiFetch('/health');
    state.backendOk = true;
    document.getElementById('statusDot').className = 'status-dot online';
    document.getElementById('statusText').textContent = 'API Online';
  } catch(_) {
    state.backendOk = false;
  }
}

function classifyIntent(query) {
  const q = query.toLowerCase();
  if (/form|फ़ॉर्म|भर|scholarship|apply/.test(q)) return { intent: 'FORM_COMPLETION', conf: 0.96 };
  if (/notice|नोटिस|document|दस्तावेज़|read|पढ़/.test(q)) return { intent: 'UNDERSTAND_DOCUMENT', conf: 0.94 };
  if (/sign|सांकेतिक|gesture|talk|isl/.test(q)) return { intent: 'COMMUNICATE', conf: 0.92 };
  return { intent: 'SEE', conf: 0.90 };
}

function fireConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
  const particles = Array.from({length:90}, () => ({
    x: canvas.width/2 + (Math.random()-0.5)*200,
    y: canvas.height*0.55,
    vx: (Math.random()-0.5)*8,
    vy: -(Math.random()*8+4),
    r: Math.random()*6+3,
    color: ['#2563eb','#22c55e','#f59e0b','#6366f1','#ec4899','#06b6d4'][Math.floor(Math.random()*6)],
    life: 1,
  }));
  let frame;
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p => {
      p.x += p.vx; p.vy += 0.25; p.y += p.vy; p.life -= 0.015;
      if (p.life <= 0) return;
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (particles.some(p=>p.life>0)) frame = requestAnimationFrame(draw);
    else { ctx.clearRect(0,0,canvas.width,canvas.height); }
  }
  cancelAnimationFrame(frame);
  draw();
}

window.handleVoiceMic = function() {
  haptics.confirm(); state.listening = true; state.voiceStatus = ''; state.intentResult = null;
  document.getElementById('micBtn')?.classList.add('listening');
  document.querySelector('.voice-btn')?.classList.add('listening');
  render(); // rerender with listening state shown

  startListening(
    transcript => { processIntent(transcript); },
    () => { state.listening = false; render(); },
    () => {
      const q = state.lang==='Hindi' ? 'छात्रवृत्ति फ़ॉर्म भरने में मदद करो' : 'Help me fill this scholarship form';
      processIntent(q);
    }
  );
};

window.handleSamplePrompt = function(q) {
  haptics.click(); processIntent(q);
};

function processIntent(query) {
  state.listening = false;
  const r = classifyIntent(query);
  state.voiceStatus = t(`सुना: "${query}"`, `Heard: "${query}"`);
  state.intentResult = r.intent;
  haptics.success();
  speak(state.lang==='Hindi' ? `समझा गया: ${r.intent}` : `Intent: ${r.intent}`);
  render();
  setTimeout(() => {
    if (r.intent === 'FORM_COMPLETION') navigate('complete');
    else if (r.intent === 'UNDERSTAND_DOCUMENT') navigate('read');
    else if (r.intent === 'COMMUNICATE') navigate('talk');
    else navigate('see');
  }, 1000);
}

function bindComplete() {
  const flow = state.formFlow;
  if (!flow) return;
  const step = flow.steps[state.formStep];
  window.speakStep = () => { haptics.click(); speak(step.prompt); };
  window.dictateStep = () => {
    haptics.click();
    const btn = document.getElementById('fieldMicBtn');
    btn?.classList.add('recording');
    startListening(
      t => { document.getElementById('stepInput').value = t; btn?.classList.remove('recording'); haptics.confirm(); },
      () => btn?.classList.remove('recording'),
      () => {
        btn?.classList.remove('recording');
        const d = demoAnswers[state.formStep];
        document.getElementById('stepInput').value = state.lang==='Hindi' ? d.hi : d.en;
      }
    );
  };
  window.submitStep = () => {
    haptics.confirm();
    const inp = document.getElementById('stepInput');
    const val = (inp?.value||'').trim() || (state.lang==='Hindi'?demoAnswers[state.formStep].hi:demoAnswers[state.formStep].en);
    state.formAnswers[step.fi] = val;
    if (state.formStep+1 < flow.total_steps) {
      state.formStep++;
      render();
      speak(flow.steps[state.formStep].prompt);
    } else {
      state.formVerified = true;
      state.verifyToken = 'VERIFIED_SAHAYAK_' + Math.floor(100000+Math.random()*900000);
      haptics.celebrate();
      render();
      fireConfetti();
      speak(t('बधाई हो! फ़ॉर्म सफलतापूर्वक सत्यापित।','Congratulations! Scholarship form fully verified.'));
    }
  };
  window.resetForm = () => {
    haptics.click(); state.formFlow = null; state.formVerified = false;
    state.formStep = 0; state.formAnswers = {}; render();
  };
  // Speak first prompt on load
  if (!state.formFlow._spoken) {
    state.formFlow._spoken = true;
    setTimeout(() => speak(step.prompt), 400);
  }
}

window.toggleWebcam = async function() {
  if (state.webcamStream) {
    state.webcamStream.getTracks().forEach(t=>t.stop());
    state.webcamStream = null;
    const v = document.getElementById('camVideo');
    if (v) { v.style.display = 'none'; v.srcObject = null; }
    const lv = document.getElementById('landmarkView');
    if (lv) lv.style.display = 'flex';
  } else {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
      state.webcamStream = stream;
      const v = document.getElementById('camVideo');
      const lv = document.getElementById('landmarkView');
      if (v) { v.srcObject = stream; v.style.display = 'block'; }
      if (lv) lv.style.display = 'none';
    } catch(e) { showToast(t('कैमरा उपलब्ध नहीं','Camera not available')); }
  }
};

// ═══════════════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════════════
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.getElementById('phoneScreen').appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function speak(text) {
  if (!state.audio || !state.synth) return;
  try {
    state.synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = state.lang === 'Hindi' ? 'hi-IN' : 'en-US';
    u.rate = 0.95;
    const voices = state.synth.getVoices();
    const v = voices.find(vv => vv.lang.startsWith(state.lang === 'Hindi' ? 'hi' : 'en'));
    if (v) u.voice = v;
    state.synth.speak(u);
  } catch(_) {}
}

function startListening(onResult, onEnd, onError) {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) { onError?.('not_supported'); onEnd?.(); return; }
  try {
    if (state.recognition) { state.recognition.abort(); }
    const r = new SpeechRec();
    r.lang = state.lang === 'Hindi' ? 'hi-IN' : 'en-US';
    r.continuous = false; r.interimResults = false;
    r.onresult = e => onResult(e.results[0][0].transcript);
    r.onerror = e => { onError?.(e.error); onEnd?.(); };
    r.onend = () => onEnd?.();
    state.recognition = r;
    r.start();
  } catch(e) { onError?.('mic_error'); onEnd?.(); }
}

const API = 'http://127.0.0.1:8000/api/v1';

async function apiFetch(path, opts={}) {
  if (!state.backendOk) throw new Error('backend_down');
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), 2500);
  const res = await fetch(API + path, { ...opts, signal: ctrl.signal });
  clearTimeout(id);
  if (!res.ok) throw new Error('api_error');
  return res.json();
}

async function checkBackend() {
  try {
    await apiFetch('/health');
    state.backendOk = true;
    document.getElementById('statusDot').className = 'status-dot online';
    document.getElementById('statusText').textContent = 'API Connected';
  } catch(_) {
    state.backendOk = false;
    document.getElementById('statusDot').className = 'status-dot local';
    document.getElementById('statusText').textContent = 'AI Engine Ready';
  }
}

function classifyIntent(query) {
  const q = query.toLowerCase();
  if (/form|फ़ॉर्म|भर|scholarship|apply/.test(q)) return { intent: 'FORM_COMPLETION', conf: 0.96 };
  if (/notice|नोटिस|document|दस्तावेज़|read|पढ़/.test(q)) return { intent: 'UNDERSTAND_DOCUMENT', conf: 0.94 };
  if (/sign|सांकेतिक|gesture|talk|isl/.test(q)) return { intent: 'COMMUNICATE', conf: 0.92 };
  return { intent: 'SEE', conf: 0.90 };
}

    () => { state.listening = false; render(); },

  );
};

function processIntent(query) {
  state.listening = false;
  const r = classifyIntent(query);
  state.voiceStatus = t(`सुना: "${query}"`, `Heard: "${query}"`);
  state.intentResult = r.intent;
  haptics.success();
  speak(state.lang==='Hindi' ? `समझा गया: ${r.intent}` : `Intent: ${r.intent}`);
  render();
  setTimeout(() => {
    if (r.intent === 'FORM_COMPLETION') navigate('complete');
    else if (r.intent === 'UNDERSTAND_DOCUMENT') navigate('read');
    else if (r.intent === 'COMMUNICATE') navigate('talk');
    else navigate('see');
  }, 1000);
}

      ${state.formStep+1===flow.total_steps ? t('✓ सत्यापित करें और जमा करें','✓ Verify & Submit Form') : t('अगला चरण →','Confirm & Continue →')}
    </button>
  </div>`;
}

}

function bindComplete() {
  const flow = state.formFlow;
  if (!flow) return;
  const step = flow.steps[state.formStep];
  window.speakStep = () => { haptics.click(); speak(step.prompt); };
  window.dictateStep = () => {
    haptics.click();
    startListening(
      t => { document.getElementById('stepInput').value = t; haptics.confirm(); },
      () => {},
      () => {
        const d = demoAnswers[state.formStep];
        document.getElementById('stepInput').value = state.lang==='Hindi' ? d.hi : d.en;
      }
    );
  };
  window.submitStep = () => {
    haptics.confirm();
    const inp = document.getElementById('stepInput');
    const val = (inp?.value||'').trim() || (state.lang==='Hindi'?demoAnswers[state.formStep].hi:demoAnswers[state.formStep].en);
    state.formAnswers[step.fi] = val;
    if (state.formStep+1 < flow.total_steps) {
      state.formStep++;
      render();
      speak(flow.steps[state.formStep].prompt);
    } else {
      state.formVerified = true;
      state.verifyToken = 'VERIFIED_SAHAYAK_' + Math.floor(100000+Math.random()*900000);
      haptics.celebrate();
      render();
      speak(t('बधाई हो! फ़ॉर्म सफलतापूर्वक सत्यापित।','Congratulations! Scholarship form fully verified.'));
    }
  };
}

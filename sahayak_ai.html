<!DOCTYPE html>
<html lang="hi" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#080c14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="Sahayak AI — Multimodal Accessibility Copilot Platform" />
<title>Sahayak AI (सहायक AI) — Multimodal Accessibility Platform</title>

<!-- Fonts: Plus Jakarta Sans & Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* ─── Premium Mobile Application Multi-Theme Tokens ──────────────── */
  :root, [data-theme="dark"] {
    --bg-app: #080c14;
    --bg-screen: #0f172a;
    --bg-card: #1e293b;
    --bg-card-subtle: #162032;
    --border-color: #334155;
    --border-glow: #3b82f6;
    --text-heading: #f8fafc;
    --text-body: #cbd5e1;
    --text-muted: #94a3b8;
    --primary-blue: #3b82f6;
    --primary-indigo: #6366f1;
    --accent-teal: #14b8a6;
    --topbar-bg: rgba(15, 23, 42, 0.95);
    --bottomnav-bg: rgba(15, 23, 42, 0.96);
    --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    --chip-bg: #1e3a8a;
    --chip-border: #3b82f6;
    --chip-text: #93c5fd;
    --input-bg: #1e293b;
    --input-border: #475569;
    --input-text: #f8fafc;
    --nav-active-bg: #1e3a8a;
    --nav-active-text: #60a5fa;
  }

  [data-theme="light"] {
    --bg-app: #e2e8f0;
    --bg-screen: #f8fafc;
    --bg-card: #ffffff;
    --bg-card-subtle: #f1f5f9;
    --border-color: #e2e8f0;
    --border-glow: #2563eb;
    --text-heading: #0f172a;
    --text-body: #475569;
    --text-muted: #64748b;
    --primary-blue: #2563eb;
    --primary-indigo: #4f46e5;
    --accent-teal: #0d9488;
    --topbar-bg: rgba(255, 255, 255, 0.95);
    --bottomnav-bg: rgba(255, 255, 255, 0.96);
    --card-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
    --chip-bg: #eff6ff;
    --chip-border: #bfdbfe;
    --chip-text: #2563eb;
    --input-bg: #ffffff;
    --input-border: #cbd5e1;
    --input-text: #0f172a;
    --nav-active-bg: #eff6ff;
    --nav-active-text: #2563eb;
  }

  [data-theme="contrast"] {
    --bg-app: #000000;
    --bg-screen: #000000;
    --bg-card: #0a0a0a;
    --bg-card-subtle: #111111;
    --border-color: #FFD700;
    --border-glow: #FFD700;
    --text-heading: #FFD700;
    --text-body: #FFD700;
    --text-muted: #FFD700;
    --primary-blue: #FFD700;
    --primary-indigo: #FFD700;
    --accent-teal: #FFD700;
    --topbar-bg: #000000;
    --bottomnav-bg: #000000;
    --card-shadow: none;
    --chip-bg: #FFD700;
    --chip-border: #000000;
    --chip-text: #000000;
    --input-bg: #000000;
    --input-border: #FFD700;
    --input-text: #FFD700;
    --nav-active-bg: #FFD700;
    --nav-active-text: #000000;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: var(--bg-app); font-family: 'Outfit', 'Plus Jakarta Sans', 'Noto Sans Devanagari', -apple-system, sans-serif; letter-spacing: -0.015em; color: var(--text-body); -webkit-font-smoothing: antialiased; transition: background 0.25s ease, color 0.25s ease; }

  .mobile-app-wrapper { width: 100%; height: 100%; height: 100dvh; display: flex; justify-content: center; align-items: center; background: var(--bg-app); }

  .phone-frame {
    position: relative; width: 100%; max-width: 440px; height: 100%; height: 100dvh;
    background: var(--bg-screen); display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 25px 60px -10px rgba(0,0,0,0.6); transition: all 0.25s ease;
  }

  @media (min-width: 480px) {
    .phone-frame {
      height: 94vh; max-height: 900px; border-radius: 40px; border: 1px solid var(--border-color);
    }
  }

  .phone-screen { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--bg-screen); position: relative; overflow: hidden; }

  .lg .screen-body, .lg button, .lg input { font-size: 1.12rem !important; }

  /* ─── Top Bar & Controls ──────────────────────────────────── */
  .top-bar { flex-shrink: 0; background: var(--topbar-bg);
    border-bottom: 1px solid var(--border-color); backdrop-filter: blur(12px); position: relative; z-index: 30; }
  
  .status-bar { display: flex; justify-content: space-between; align-items: center;
    padding: 10px 18px 2px; font-size: 11px; font-weight: 700; color: var(--text-muted); font-family: 'Inter', sans-serif; }
  .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .status-dot.online { background: #10b981; }
  .status-dot.local { background: var(--primary-blue); animation: pulse 1.5s infinite; }
  
  .app-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 10px; }
  .app-logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--primary-blue), var(--primary-indigo)); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
  [data-theme="contrast"] .logo-icon { background: #FFD700; color: #000; }

  .logo-text h1 { font-size: 16px; font-weight: 800; color: var(--text-heading); line-height: 1; letter-spacing: -0.02em; }
  .logo-text span { font-size: 10.5px; color: var(--text-muted); font-weight: 600; }
  
  .top-controls { display: flex; align-items: center; gap: 4px; }
  .tc-btn { height: 32px; padding: 0 8px; border-radius: 10px; display: flex; align-items: center; gap: 4px;
    justify-content: center; font-size: 11.5px; font-weight: 800; color: var(--text-body); transition: all .15s ease;
    background: var(--bg-card); border: 1px solid var(--border-color); cursor: pointer; }
  .tc-btn:active { transform: scale(.92); }
  .tc-btn.active { background: var(--primary-blue); color: #fff; border-color: var(--primary-blue); }
  [data-theme="contrast"] .tc-btn.active { background: #FFD700; color: #000; }

  .lang-btn { height: 32px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--border-color);
    font-size: 11px; font-weight: 800; color: var(--text-heading); display: flex; align-items: center; gap: 4px; background: var(--bg-card); cursor: pointer; }

  /* ─── Screen Viewport & Bottom Navigation ─────────────────── */
  .screen-body { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; position: relative; z-index: 10; }

  .bottom-nav { flex-shrink: 0; background: var(--bottomnav-bg);
    border-top: 1px solid var(--border-color); backdrop-filter: blur(16px); padding: 6px 0 6px; z-index: 30; }
  .nav-grid { display: flex; align-items: center; justify-content: space-around; width: 100%; max-width: 540px; margin: 0 auto; overflow-x: auto; gap: 1px; padding: 0 2px; -webkit-overflow-scrolling: touch; }
  .nav-grid::-webkit-scrollbar { display: none; }
  .nav-btn { flex: 1; min-width: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5px 1px 3px; border-radius: 12px; color: var(--text-muted); transition: all .15s ease; gap: 2px; background: transparent; border: none; cursor: pointer; }
  .nav-label { font-size: 9px; font-weight: 800; text-align: center; line-height: 1; white-space: nowrap; }
  .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 5px 2px 3px; border-radius: 12px; color: var(--text-muted); transition: all .15s ease; gap: 2px; background: transparent; border: none; cursor: pointer; }
  .nav-btn.active { background: var(--nav-active-bg); color: var(--nav-active-text); font-weight: 800; }
  .nav-btn svg { width: 17px; height: 17px; stroke-width: 2.2; }
  .nav-label { font-size: 8.5px; font-weight: 700; text-align: center; line-height: 1; }
  .nav-home-bar { width: 110px; height: 4px; border-radius: 2px; background: var(--border-color); margin: 4px auto 0; opacity: .8; }

  /* ─── UI Primitives & Cards ──────────────────────────────── */
  .screen-pad { padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 100%; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    font-weight: 700; color: var(--text-body); padding: 6px 12px; border-radius: 10px; background: var(--bg-card); border: 1px solid var(--border-color); cursor: pointer; }
  .row-between { display: flex; align-items: center; justify-content: space-between; }
  
  .badge { display: inline-flex; align-items: center; padding: 4px 10px;
    border-radius: 99px; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  .badge-blue { background: rgba(59,130,246,0.15); color: var(--primary-blue); border: 1px solid rgba(59,130,246,0.3); }
  .badge-green { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
  .badge-amber { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
  .badge-purple { background: rgba(168,85,247,0.15); color: #a855f7; border: 1px solid rgba(168,85,247,0.3); }
  .badge-indigo { background: rgba(99,102,241,0.15); color: #6366f1; border: 1px solid rgba(99,102,241,0.3); }
  .badge-rose { background: rgba(244,63,94,0.15); color: #f43f5e; border: 1px solid rgba(244,63,94,0.3); }
  
  .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 18px; padding: 14px; box-shadow: var(--card-shadow); color: var(--text-body); }
  .section-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 12px; color: var(--text-body); }
  
  .btn-primary { display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 16px; border-radius: 14px; font-weight: 800; font-size: 13.5px;
    background: var(--primary-blue); color: #fff; box-shadow: 0 6px 18px rgba(59,130,246,0.35);
    transition: all .15s ease; width: 100%; border: none; cursor: pointer; }
  [data-theme="contrast"] .btn-primary { background: #FFD700; color: #000; font-weight: 900; }
  .btn-primary:active { transform: scale(.98); }
  
  .btn-ghost { display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 12px; border-radius: 10px; font-weight: 700; font-size: 12px;
    border: 1px solid var(--border-color); color: var(--text-body); transition: all .15s; background: var(--bg-card); cursor: pointer; }
  
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--chip-bg); border: 1px solid var(--chip-border); border-radius: 99px; padding: 4px 10px; font-size: 10.5px; font-weight: 700; color: var(--chip-text); }
  
  .infobox { border-radius: 14px; padding: 12px; border: 1px solid var(--border-color); font-size: 12px; line-height: 1.5; background: var(--bg-card); color: var(--text-body); }
  
  .progress-track { background: var(--border-color); border-radius: 99px; height: 8px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 99px; background: var(--primary-blue); transition: width .35s ease; }

  /* ─── Journey Stepper Bar ─────────────────────────────────── */
  .journey-bar { display: flex; align-items: center; gap: 4px; overflow-x: auto; padding: 8px 12px; background: var(--bg-card); border-bottom: 1px solid var(--border-color); -webkit-overflow-scrolling: touch; }
  .journey-step-chip { display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 20px; font-size: 10.5px; font-weight: 800; white-space: nowrap; border: 1px solid var(--border-color); background: var(--bg-screen); color: var(--text-muted); cursor: pointer; }
  .journey-step-chip.active { background: var(--primary-blue); color: #fff; border-color: var(--primary-blue); }
  .journey-step-chip.done { background: rgba(16,185,129,0.15); color: #10b981; border-color: rgba(16,185,129,0.3); }

  /* ─── Spatial HUD Camera Viewport ─────────────────────────── */
  .cam-hud-viewport { width: 100%; height: 220px; background: #070a12; border-radius: 20px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; border: 1.5px solid var(--border-color); box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
  .cam-hud-overlay { position: absolute; inset: 0; pointer-events: none; }
  .spatial-target-box { position: absolute; border: 2px solid #38bdf8; border-radius: 12px; background: rgba(56,189,248,0.12); padding: 4px; display: flex; flex-direction: column; justify-content: space-between; }
  .spatial-label-badge { background: #0284c7; color: #fff; font-size: 9.5px; font-weight: 900; padding: 2px 6px; border-radius: 6px; text-transform: uppercase; width: fit-content; }
  .spatial-clock-pill { background: rgba(15,23,42,0.9); color: #fef08a; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 8px; border: 1px solid #eab308; }

  /* ─── Voice Waveform Animation ────────────────────────────── */
  .waveform-box { display: flex; align-items: center; justify-content: center; gap: 4px; height: 36px; padding: 0 10px; }
  .wave-bar { width: 4px; height: 12px; background: var(--primary-blue); border-radius: 4px; animation: wave-anim 1s ease-in-out infinite; }
  .wave-bar:nth-child(2) { animation-delay: 0.15s; }
  .wave-bar:nth-child(3) { animation-delay: 0.3s; }
  .wave-bar:nth-child(4) { animation-delay: 0.45s; }
  .wave-bar:nth-child(5) { animation-delay: 0.6s; }
  @keyframes wave-anim { 0%, 100% { height: 8px; } 50% { height: 32px; } }

  /* ─── Hero Voice Button ───────────────────────────────────── */
  .voice-hero-container { position: relative; display: flex; align-items: center; justify-content: center; padding: 8px 0; }
  .voice-btn { width: 108px; height: 108px; border-radius: 50%; display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%); color: #fff; box-shadow: 0 10px 30px rgba(37,99,235,0.45);
    transition: all .2s ease; font-size: 11px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .05em; z-index: 10; border: 2px solid rgba(255,255,255,0.3); cursor: pointer; }
  [data-theme="contrast"] .voice-btn { background: #FFD700; color: #000; border-color: #000; }
  .voice-btn:active { transform: scale(.94); }
  .voice-btn.listening { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); box-shadow: 0 10px 30px rgba(239,68,68,0.5); }
  .voice-btn svg { width: 40px; height: 40px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25)); }

  @keyframes pulse-aura {
    0% { box-shadow: 0 0 0 0 rgba(59,130,246,0.45), 0 10px 30px rgba(37,99,235,0.4); }
    70% { box-shadow: 0 0 0 22px rgba(59,130,246,0), 0 10px 30px rgba(37,99,235,0.4); }
    100% { box-shadow: 0 0 0 0 rgba(59,130,246,0), 0 10px 30px rgba(37,99,235,0.4); }
  }
  .voice-btn:not(.listening) { animation: pulse-aura 2.2s infinite ease-out; }

  /* ─── Bento Action Cards ─────────────────────────────────── */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .action-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 12px; text-align: left; transition: all .2s ease; display: flex; flex-direction: column; gap: 5px; box-shadow: var(--card-shadow); cursor: pointer; position: relative; overflow: hidden; }
  .action-card:active { transform: scale(.97); }
  .action-card.featured { border-color: var(--border-glow); background: var(--bg-card-subtle); }
  
  .action-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0,0,0,0.18); transition: transform 0.2s ease; }
  .action-card:hover .action-icon { transform: scale(1.06); }
  
  .icon-complete { background: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%); }
  .icon-read     { background: linear-gradient(135deg, #4f46e5 0%, #a855f7 100%); }
  .icon-talk     { background: linear-gradient(135deg, #0d9488 0%, #10b981 100%); }
  .icon-see      { background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%); }
  .icon-heatmap  { background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%); }
  .icon-spatial  { background: linear-gradient(135deg, #0284c7 0%, #3b82f6 100%); }
  .icon-docqa    { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); }

  .action-title { font-size: 13.5px; font-weight: 800; color: var(--text-heading); line-height: 1.1; letter-spacing: -0.01em; }
  .action-sub { font-size: 10px; color: var(--text-muted); line-height: 1.35; font-weight: 500; }
  .action-link { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; display: flex; align-items: center; gap: 3px; }

  /* ─── Form Inputs ─────────────────────────────────────────── */
  .field-wrap { position: relative; }
  .field-input { width: 100%; padding: 12px 42px 12px 14px; border-radius: 12px; border: 1px solid var(--input-border); font-size: 13.5px; font-weight: 600; color: var(--input-text); background: var(--input-bg); outline: none; transition: all .15s ease; }
  .field-input:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
  .field-mic-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 10px; background: var(--primary-blue); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: none; cursor: pointer; }
  
  .gesture-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .gesture-btn { padding: 9px 3px; border-radius: 10px; text-align: center; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-body); transition: all .15s; cursor: pointer; }
  .gesture-btn.active { background: #10b981; color: #fff; border-color: #10b981; }
  .gesture-en { font-size: 10.5px; font-weight: 800; }

  .obj-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .obj-btn { padding: 10px 4px; border-radius: 12px; text-align: center; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-body); transition: all .15s; cursor: pointer; }
  .obj-btn.active { background: #f59e0b; color: #fff; border-color: #f59e0b; font-weight: 800; }
  .obj-en { font-size: 11px; font-weight: 800; }

  /* ─── Global Unified Assistance Overlay Modal ────────────── */
  .overlay-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 500; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: all 0.25s ease; }
  .overlay-backdrop.open { opacity: 1; pointer-events: auto; }
  .overlay-modal { width: 100%; max-width: 440px; background: var(--bg-card); border-radius: 28px 28px 0 0; border-t: 1.5px solid var(--border-color); padding: 20px; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  .overlay-backdrop.open .overlay-modal { transform: translateY(0); }

  #confetti-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
</style>
</head>
<body>

<div class="mobile-app-wrapper">
  <div class="phone-frame" id="phoneFrame">
    <div class="phone-screen" id="phoneScreen">
      <!-- NATIVE MOBILE TOP BAR -->
      <header class="top-bar">
        <div class="status-bar" id="statusBar">
          <span>09:41</span>
          <span id="backendLabel">
            <span class="status-dot local" id="statusDot"></span>
            <span id="statusText">AI Engine Ready</span>
            &nbsp;·&nbsp;5G&nbsp;·&nbsp;100%
          </span>
        </div>
        <div class="app-bar">
          <div class="app-logo">
            <div class="logo-icon">स</div>
            <div class="logo-text">
              <h1 id="appTitle">सहायक AI</h1>
              <span>Accessibility Copilot</span>
            </div>
          </div>
          <div class="top-controls">
            <!-- Global Copilot Overlay Launcher -->
            <button class="tc-btn" title="Open Copilot Overlay" onclick="toggleOverlay()">✨ Help</button>
            <button class="tc-btn" id="themeBtn" title="Switch Theme (Dark / Light / Contrast)" onclick="toggleTheme()">
              <span id="themeIcon">🌙</span> <span id="themeLabel" style="font-size:10px">Dark</span>
            </button>
            <button class="tc-btn" id="audioBtn" title="Toggle Voice Guidance" onclick="toggleAudio()">🔊</button>
            <button class="lang-btn" id="langBtn" onclick="toggleLang()">🌐 हिं</button>
          </div>
        </div>

        <!-- Unified Task Journey Stepper -->
        <div class="journey-bar" id="journeyBar"></div>
      </header>

      <!-- SCREEN CONTENT VIEWPORT -->
      <main class="screen-body" id="screenBody"></main>

      <!-- NATIVE BOTTOM TAB NAVIGATION -->
      <nav class="bottom-nav">
        <div class="nav-grid" id="navGrid"></div>
        <div class="nav-home-bar"></div>
      </nav>
    </div>
    <canvas id="confetti-canvas"></canvas>

function speak(text) {
  if (!state.audio || !state.synth) return;
  try {
    state.synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = state.lang === 'Hindi' ? 'hi-IN' : 'en-US';
    u.rate = 0.95;
    const voices = state.synth.getVoices();
    const v = voices.find(vv => vv.lang.startsWith(state.lang === 'Hindi' ? 'hi' : 'en'));
    if (v) u.voice = v;
    state.synth.speak(u);
  } catch(_) {}
}

function startListening(onResult, onEnd, onError) {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) { onError?.('not_supported'); onEnd?.(); return; }
  try {
    if (state.recognition) { state.recognition.abort(); }
    const r = new SpeechRec();
    r.lang = state.lang === 'Hindi' ? 'hi-IN' : 'en-US';
    r.continuous = false; r.interimResults = false;
    r.onresult = e => onResult(e.results[0][0].transcript);
    r.onerror = e => { onError?.(e.error); onEnd?.(); };
    r.onend = () => onEnd?.();
    state.recognition = r;
    r.start();
  } catch(e) { onError?.('mic_error'); onEnd?.(); }
}

const API = 'http://127.0.0.1:8000/api/v1';

async function apiFetch(path, opts={}) {
  if (!state.backendOk) throw new Error('backend_down');
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), 2500);
  const res = await fetch(API + path, { ...opts, signal: ctrl.signal });
  clearTimeout(id);
  if (!res.ok) throw new Error('api_error');
  return res.json();
}

async function checkBackend() {
  try {
    const res = await fetch(API + '/health', { timeout: 2000 });
    if (res.ok) {
      state.backendOk = true;
      document.getElementById('statusDot').className = 'status-dot online';
      document.getElementById('statusText').textContent = 'API Connected';
    } else {
      throw new Error('health_error');
    }
  } catch(_) {
    state.backendOk = false;
    document.getElementById('statusDot').className = 'status-dot local';
    document.getElementById('statusText').textContent = 'AI Engine Ready';
  }
}

function classifyIntent(query) {
  const q = query.toLowerCase();
  if (/camera|कैमरा|stream|lens|hud|scan/.test(q)) return { intent: 'CAMERA', conf: 0.99 };
  if (/spatial|vision|clock|direction|distance/.test(q)) return { intent: 'SPATIAL', conf: 0.98 };
  if (/qa|question|ask|document|नोटिस/.test(q)) return { intent: 'DOC_QA', conf: 0.96 };
  if (/form|फ़ॉर्म|भर|scholarship|apply/.test(q)) return { intent: 'FORM_COMPLETION', conf: 0.96 };
  if (/sign|सांकेतिक|gesture|talk|isl/.test(q)) return { intent: 'COMMUNICATE', conf: 0.92 };
  return { intent: 'VOICE_COPILOT', conf: 0.90 };
}

  if (state.theme === 'dark') {
    themeIcon.textContent = '🌙';
    themeLabel.textContent = 'Dark';
    themeBtn.className = 'tc-btn active';
  } else if (state.theme === 'light') {
    themeIcon.textContent = '☀️';
    themeLabel.textContent = 'Light';
    themeBtn.className = 'tc-btn';
  } else if (state.theme === 'contrast') {

    themeBtn.className = 'tc-btn active';

  ng.innerHTML = NAV_ITEMS.map(n => `
    <button class="nav-btn ${state.screen===n.id?'active':''}" onclick="navigate('${n.id}')">
      ${n.icon}
      <span class="nav-label">${state.lang==='Hindi'?n.labelHi:n.labelEn}</span>
    </button>`).join('');
}

function navigate(id) {
  haptics.click();
  if (state.synth) state.synth.cancel();
  state.screen = id;
  renderJourneyBar();
  renderNav();
  render();
}

function render() {
  const body = document.getElementById('screenBody');
  switch(state.screen) {
    case 'home':          body.innerHTML = renderHome(); break;
    case 'camera':        body.innerHTML = renderCamera(); bindCamera(); break;
    case 'spatial':       body.innerHTML = renderSpatial(); break;
    case 'doc_qa':        body.innerHTML = renderDocQA(); break;
    case 'complete':      body.innerHTML = renderComplete(); bindComplete(); break;
    case 'talk':          body.innerHTML = renderTalk(); break;
    case 'heatmap':       body.innerHTML = renderHeatmap(); break;
    case 'profile':       body.innerHTML = renderProfile(); break;
    default: body.innerHTML = renderHome();
  }
}

window.handleVoiceMic = function() {
  haptics.confirm(); state.listening = true; state.voiceStatus = ''; state.intentResult = null;
  render();

  startListening(
    transcript => { processIntent(transcript); },
    () => { state.listening = false; render(); },
    () => {
      const q = state.lang==='Hindi' ? 'वस्तुओं की घड़ी दिशा बताओ' : 'Show clock direction objects';
      processIntent(q);
    }
  );
};

window.handleSamplePrompt = function(q) {
  haptics.click(); processIntent(q);
};

function processIntent(query) {
  state.listening = false;
  const r = classifyIntent(query);
  state.voiceStatus = t(`सुना: "${query}"`, `Heard: "${query}"`);
  state.intentResult = r.intent;
  haptics.success();
  speak(state.lang==='Hindi' ? `समझा गया: ${r.intent}` : `Intent: ${r.intent}`);
  render();
  setTimeout(() => {
    if (r.intent === 'CAMERA') navigate('camera');
    else if (r.intent === 'SPATIAL') navigate('spatial');
    else if (r.intent === 'DOC_QA') navigate('doc_qa');
    else if (r.intent === 'FORM_COMPLETION') navigate('complete');
    else if (r.intent === 'COMMUNICATE') navigate('talk');
    else navigate('spatial');
  }, 1000);
}

function bindCamera() {
  setTimeout(() => {
    const video = document.getElementById('webcamFeed');
    const toggleBtn = document.getElementById('camToggleBtn');
    const analyzeBtn = document.getElementById('camAnalyzeBtn');

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia && video) {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(stream => {
          video.srcObject = stream;
          video.style.display = 'block';
        })
        .catch(_ => {
          // Camera permission blocked or not available; fallback to visual reticle
        });
    }

    if (toggleBtn) {
      toggleBtn.onclick = () => {
        haptics.click();
        if (toggleBtn.innerText.includes('Pause')) {
          toggleBtn.innerText = '▶️ Start Stream';
          toggleBtn.style.background = '#10b981';
          if (video && video.srcObject) {
            video.srcObject.getTracks().forEach(t => t.enabled = false);
          }
        } else {
          toggleBtn.innerText = '⏹️ Pause';
          toggleBtn.style.background = '#ef4444';
          if (video && video.srcObject) {
            video.srcObject.getTracks().forEach(t => t.enabled = true);
          }
        }
      };
    }

    if (analyzeBtn) {
      analyzeBtn.onclick = async () => {
        haptics.confirm();
        const guidanceEl = document.getElementById('camGuidanceText');
        if (guidanceEl) {
          guidanceEl.innerText = state.lang === 'Hindi'
            ? 'नया फ़्रेम विश्लेषित किया गया: 2 वस्तुएं व दस्तावेज़ टेक्स्ट पहचाना गया।'
            : 'New frame analyzed: 2 objects and document text verified.';
          speak(guidanceEl.innerText);
        }

        // Send API request to live backend if online
        if (state.backendOk) {
          try {
            await apiFetch('/camera/process', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                image_base64: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==",
                width: 1280,
                height: 720,
                camera_position: "back"
              })
            });
          } catch (_) {}
        }
      };
    }
  }, 100);
}

              <button onclick="speak('${isH?q.aHi:q.aEn}')" class="btn-ghost" style="padding:2px 6px">🔊 Speak</button>
            </div>
            <p style="font-size:12px;color:var(--text-heading);margin-bottom:4px;font-weight:600">${isH?q.aHi:q.aEn}</p>
            <div style="font-size:10px;color:var(--text-muted)">Source Reference: <em>${q.ref}</em></div>
          </div>`).join('')}
      </div>
    </div>

    <!-- Document -> Task Conversion Card -->
    <div class="card" style="border-color:var(--border-glow);background:var(--bg-card-subtle)">
      <div class="row-between" style="margin-bottom:6px">
        <span class="badge badge-purple">🎯 Document → Actionable Task</span>
        <span style="font-size:10.5px;font-weight:800;color:#10b981">Auto-Extracted</span>
      </div>
      <h4 style="font-size:13.5px;font-weight:800;color:var(--text-heading);margin-bottom:4px">${state.extractedTask.title}</h4>
      <p style="font-size:11.5px;color:var(--text-muted);margin-bottom:10px">${state.extractedTask.desc}</p>
      <button class="btn-primary" onclick="navigate('complete')">${t('📝 फ़ॉर्म आवेदन चालू करें →','Launch Form Completion Workflow →')}</button>
    </div>
  </div>`;
}

/* ─── 6. LINEARIZED FORM COMPLETION & WCAG CERTIFICATE SCREEN ───── */
function renderComplete() {
  const isH = state.lang === 'Hindi';
  if (!state.formFlow || state.formFlow._lang !== state.lang) {
    state.formFlow = buildFormFlow();
    state.formFlow._lang = state.lang;
    state.formStep = 0; state.formAnswers = {}; state.formVerified = false;
  }
  const flow = state.formFlow;
  if (state.formVerified) return renderVerified();
  const step = flow.steps[state.formStep];
  const prog = Math.round(((state.formStep+1)/flow.total_steps)*100);
  const demo = demoAnswers[state.formStep];
  const demoVal = isH ? demo.hi : demo.en;

  return `
  <div class="screen-pad">
    <div class="row-between">
      <button class="back-btn" onclick="navigate('doc_qa')">${ICON.arrow_l} ${t('वापस','Back')}</button>
      <span class="badge badge-blue">${state.formStep+1} / ${flow.total_steps}</span>
    </div>

    <div>
      <div class="row-between" style="font-size:11px;font-weight:700;margin-bottom:6px">
        <span style="color:var(--text-muted)">${t('प्रगति (Linearized Task Flow)','Task Progress')}</span>
        <span style="font-family:monospace;font-weight:800;color:var(--primary-blue)">${prog}%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:${prog}%"></div>
      </div>
    </div>

    <div class="card">
      <div class="row-between" style="margin-bottom:8px">
        <div>
          <div style="font-size:10px;font-weight:800;color:var(--primary-blue);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px">
            ${step.label}
          </div>
          <h2 style="font-size:1.25rem;font-weight:800;color:var(--text-heading);line-height:1.2">${step.display}</h2>
        </div>
        <button onclick="speakStep()" style="width:36px;height:36px;border-radius:10px;
          background:var(--chip-bg);color:var(--chip-text);display:flex;align-items:center;justify-content:center;
          border:1px solid var(--chip-border);flex-shrink:0;cursor:pointer">
          ${ICON.volume}
        </button>
      </div>
      <p style="font-size:12px;color:var(--text-body);line-height:1.55;margin-bottom:14px;font-weight:500">
        "${step.prompt}"
      </p>

      <div class="field-wrap">
        <input class="field-input" id="stepInput" type="text"
          placeholder="${t('उत्तर लिखें या बोलें...','Type or dictate your answer...')}"
          value="${demoVal}" />
        <button class="field-mic-btn" id="fieldMicBtn" onclick="dictateStep()">
          ${ICON.mic_sm}
        </button>
      </div>
    </div>

    <button class="btn-primary" onclick="submitStep()">
      ${state.formStep+1===flow.total_steps ? t('✓ सत्यापित करें और जमा करें','✓ Verify & Submit Form') : t('अगला चरण →','Confirm & Continue →')}
    </button>
  </div>`;
}

function renderVerified() {
  const isH = state.lang === 'Hindi';
  return `
  <div class="screen-pad">
    <div style="text-align:center;padding:12px 0 6px">
      <div style="width:64px;height:64px;border-radius:50%;background:#10b981;color:#fff;
        margin:0 auto 12px;display:flex;align-items:center;justify-content:center">${ICON.award}</div>
      <div class="badge badge-green" style="margin-bottom:8px">${t('चरण 6: कार्य सत्यापन सफल','STAGE 6: TASK VERIFIED')}</div>
      <h2 style="font-size:1.5rem;font-weight:800;color:var(--text-heading)">${t('फ़ॉर्म पूर्ण!','Form Completed!')}</h2>
    </div>

    <div class="cert">
      <div class="row-between" style="border-bottom:1px solid var(--border-color);padding-bottom:10px;margin-bottom:10px">
        <span style="font-size:11px;font-weight:800;color:#10b981">${t('सत्यापन टोकन','Verification Token')}</span>
        <span class="cert-token">${state.verifyToken}</span>
      </div>
      <div class="cert-row"><span>Task Type:</span><strong>SCHOLARSHIP_FORM_7F</strong></div>
      <div class="cert-row"><span>Fields:</span><strong style="color:#10b981">7 / 7 (100%)</strong></div>
      <div class="cert-row"><span>Applicant:</span><strong>${state.formAnswers['full_name']||'Satvik Sharma'}</strong></div>
    </div>

    <button class="btn-primary" onclick="navigate('heatmap')">${t('📊 सुलभता हीटमैप देखें →','View Accessibility Heatmap →')}</button>
  </div>`;
}

function bindComplete() {
  const flow = state.formFlow;
  if (!flow) return;
  const step = flow.steps[state.formStep];
  window.speakStep = () => { haptics.click(); speak(step.prompt); };
  window.dictateStep = () => {
    haptics.click();
    startListening(
      t => { document.getElementById('stepInput').value = t; haptics.confirm(); },
      () => {},
      () => {
        const d = demoAnswers[state.formStep];
        document.getElementById('stepInput').value = state.lang==='Hindi' ? d.hi : d.en;
      }
    );
  };
  window.submitStep = () => {
    haptics.confirm();
    const inp = document.getElementById('stepInput');
    const val = (inp?.value||'').trim() || (state.lang==='Hindi'?demoAnswers[state.formStep].hi:demoAnswers[state.formStep].en);
    state.formAnswers[step.fi] = val;
    if (state.formStep+1 < flow.total_steps) {
      state.formStep++;
      render();
      speak(flow.steps[state.formStep].prompt);
    } else {
      state.formVerified = true;
      state.verifyToken = 'VERIFIED_SAHAYAK_' + Math.floor(100000+Math.random()*900000);
      haptics.celebrate();
      render();
      speak(t('बधाई हो! फ़ॉर्म सफलतापूर्वक सत्यापित।','Congratulations! Scholarship form fully verified.'));
    }
  };
}

function renderTalk() {
  const s = signs[state.detectedSign];
  return `
  <div class="screen-pad">
    <div class="row-between">
      <button class="back-btn" onclick="navigate('home')">${ICON.arrow_l} ${t('वापस','Back')}</button>
      <span class="badge badge-green">3D ISL INTERPRETER</span>
    </div>

    <div class="card" style="text-align:center;padding:24px">
      <div style="font-size:1.5rem;font-weight:800;color:var(--text-heading);margin-bottom:4px">${state.lang==='Hindi'?s.hi:s.en}</div>
      <div style="font-size:11px;color:#10b981;font-weight:800;text-transform:uppercase">21 MediaPipe Landmarks (96% Conf)</div>
    </div>

    <div class="gesture-grid">
      ${Object.keys(signs).map(id => `
        <button class="gesture-btn ${state.detectedSign===id?'active':''}" onclick="selectGesture('${id}')">
          <div class="gesture-en">${id}</div>
        </button>`).join('')}
    </div>
  </div>`;
}

window.selectGesture = function(id) {
  haptics.click(); state.detectedSign = id; render();
};

const signs = {
  HELP: {hi:'सहायता चाहिए', en:'I need Help'},
  THANK_YOU: {hi:'धन्यवाद', en:'Thank You'},
  WATER: {hi:'पानी चाहिए', en:'Water Please'},
  YES: {hi:'हाँ (YES)', en:'Yes / Agreed'},
  NO: {hi:'नहीं (NO)', en:'No / Disagree'},
};

/* ─── 12. FRICTION HEATMAP & INSIGHTS ANALYTICS DASHBOARD ───────── */
function renderHeatmap() {
  return `
  <div class="screen-pad">
    <div class="row-between">
      <button class="back-btn" onclick="navigate('home')">${ICON.arrow_l} ${t('वापस','Back')}</button>
      <span class="badge badge-purple">FRICTION TELEMETRY INSIGHTS</span>
    </div>

    <div class="card">
      <div class="row-between" style="margin-bottom:8px">
        <h3 style="font-size:14px;font-weight:800;color:var(--text-heading)">Real-Time Telemetry Dashboard</h3>
        <span class="badge badge-green">87% Completion Rate</span>
      </div>
      <div class="grid-2" style="margin-bottom:10px">
        <div style="background:var(--bg-card-subtle);padding:10px;border-radius:12px;text-align:center">
          <div style="font-size:1.4rem;font-weight:900;color:var(--primary-blue)">1.4 min</div>
          <div style="font-size:10px;color:var(--text-muted)">Avg Form Time</div>
        </div>
        <div style="background:var(--bg-card-subtle);padding:10px;border-radius:12px;text-align:center">
          <div style="font-size:1.4rem;font-weight:900;color:#10b981">0 retries</div>
          <div style="font-size:10px;color:var(--text-muted)">Voice Dictation</div>
        </div>
      </div>
      <div style="font-size:11px;color:var(--text-muted)">Telemetry actively tracking interaction friction points without medical data collection.</div>
    </div>

    <button class="btn-primary" onclick="navigate('profile')">${t('👤 सुलभता ट्विन प्रोफ़ाइल बदलें →','Manage Twin Profile Preferences →')}</button>
  </div>`;
}

/* ─── 10. ADVANCED ACCESSIBILITY TWIN PERSONALIZATION PANEL ─────── */
function renderProfile() {
  return `
  <div class="screen-pad">
    <div class="row-between">
      <button class="back-btn" onclick="navigate('home')">${ICON.arrow_l} ${t('वापस','Back')}</button>
      <span class="badge badge-blue">ACCESSIBILITY TWIN PANEL</span>
    </div>

    <div class="card">
      <h3 style="font-size:14px;font-weight:800;color:var(--text-heading);margin-bottom:12px">Personalized Accessibility Twin</h3>
      
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="row-between">
          <span style="font-size:12px;font-weight:700">Language / भाषा</span>
          <button onclick="toggleLang()" class="btn-ghost" style="padding:3px 10px">${state.lang}</button>
        </div>
        <div class="row-between">
          <span style="font-size:12px;font-weight:700">Theme Mode</span>
          <button onclick="toggleTheme()" class="btn-ghost" style="padding:3px 10px">${state.theme.toUpperCase()}</button>
        </div>
        <div class="row-between">
          <span style="font-size:12px;font-weight:700">Voice Narration</span>
          <button onclick="toggleAudio()" class="btn-ghost" style="padding:3px 10px">${state.audio?'ENABLED':'DISABLED'}</button>
        </div>
        <div class="row-between">
          <span style="font-size:12px;font-weight:700">Haptic Vibration</span>
          <button onclick="state.haptic=!state.haptic;render()" class="btn-ghost" style="padding:3px 10px">${state.haptic?'ENABLED':'DISABLED'}</button>
        </div>
      </div>
    </div>

    <button class="btn-primary" onclick="haptics.success();navigate('home')">${t('✓ प्रोफ़ाइल सहेजें','Save Twin Preferences')}</button>
  </div>`;
}

async function init() {
  applyTheme();
  renderJourneyBar();
  renderNav();
  render();
  checkBackend();
}

init();
</script>
</body>
